# 冻结双骨干定位器：DINOv2 ViT-L 模板塔 + InfMAE ViT-B 红外塔 + CorrLayer
encoder: dinov2
modulator: correlation
pretrained: true
# 模板塔预训练权重：null=用 timm 自动下载/缓存；
# 如需指定本地文件，填绝对路径（如 /path/to/weights.pth）
pretrained_path: null

# 数据（由命令行 --data-root 或训练脚本注入；勿在此写机器路径）
data_root: null
train_split: train         # 全量数据：训练用官方 train 划分
eval_split: val
instances: null
img_size: [384, 640]       # H, W，保长宽比 letterbox
patch_size: 224
sigma_factor: 0.3
n_templates: 1             # 训练模板数
eval_n_templates: 1        # 评测模板数（扫 N 时改此项）
min_gap_frames: 30         # Δt≥1s

# 训练
epochs: 100
batch_size: 12
num_workers: 2
lr: 0.00005
alpha: 2.0
pos_weight: 10.0
suppress_weight: 5.0
seed: 0
eval_every: 5
save_dir: ./checkpoints/locator
ir_encoder: infmae
dual_template: 1
identity_expert: random  # 代码按固定 seed 生成（见 models/identity_expert.py）；无需外部文件
mask_null_p: 0.25
early_stop_patience: 6
projection_adapter: orth
corr_ce_weight: 0.1
corr_distill_weight: 0.05
# 塌缩监控门禁（只监控、不影响优化），默认关闭。
collapse_gate: false
collapse_gate_baseline: 0.284
deterministic: true
collapse_gate_early_stop: false
