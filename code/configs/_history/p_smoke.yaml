# 实验 P-a 冒烟：c1_overfit 子集取法（car_133）+ 分支 A 变体 + a2 配方字段
# 门禁：20 epoch 内 train loss 降至初始值 10% 以下且子集 PCK ≥ 0.9
encoder: dinov2
modulator: correlation
pretrained: true
pretrained_path: null

data_root: /home/user/Code/Datasets/CSTLoc-UAV_v2
train_split: train
eval_split: train
instances: [car_133]
img_size: [384, 640]
patch_size: 224
sigma_factor: 0.3
n_templates: 1
eval_n_templates: 1
min_gap_frames: 30

epochs: 20
batch_size: 12
num_workers: 4
lr: 0.0001
alpha: 2.0
pos_weight: 10.0
suppress_weight: 5.0
seed: 42
eval_every: 5
save_dir: ./checkpoints/p_distmargin_smoke
ir_encoder: infmae
dual_template: 1
identity_expert: ./checkpoints/j2_expert_pretrain/head_random.pt
mask_null_p: 0.25
distractor_margin: 1
