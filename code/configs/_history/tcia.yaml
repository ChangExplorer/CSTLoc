# 任务书3.6 TCIA独立验证器（Localizer/V″不改）
seed: 42
rank: 4
alpha: 4
head_dim: 256
epochs: 15
trials: 20000
episodic:
  instances_per_batch: 4
  trials_per_instance: 2
optimizer:
  head_lr: 0.001
  lora_lr: 0.0001
  weight_decay: 0.0
loss:
  tau: 0.07
  wrong_margin: 0.2
  wrong_weight: 0.5
  modality_weight: 0.1
selection:
  metric: real_top1_minus_wrong_top1
  tie_break: real_top1
