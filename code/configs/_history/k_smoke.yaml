# 实验 K 阶段1.2a 冒烟：v2_s1_overfit.yaml 复制 + epochs=20/eval_every=5/deterministic: true
encoder: dinov2
modulator: correlation
pretrained: true
pretrained_path: null

# 数据
data_root: /home/user/Code/Datasets/CSTLoc-UAV_v2
train_split: train
eval_split: train
instances: ['car_133']
img_size: [384, 640]
patch_size: 224
sigma_factor: 0.3
n_templates: 1
eval_n_templates: 1
min_gap_frames: 30

# 训练
epochs: 20
batch_size: 12
num_workers: 4
lr: 0.0001
alpha: 2.0
pos_weight: 10.0
suppress_weight: 5.0
seed: 42
eval_every: 5
save_dir: ./checkpoints/k_smoke
ir_encoder: infmae
dual_template: 1
deterministic: true
