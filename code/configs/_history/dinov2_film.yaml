# ResNet18 + FiLM（baseline：全局通道调制，对照组）
encoder: dinov2
modulator: film
pretrained: true
# ResNet18 预训练权重：null=用 timm 自动下载/本地缓存；
# 如需指定路径，填绝对路径即可（如 /path/to/resnet18.pth）
pretrained_path: null

data_root: ../dataset/CSTLoc-UAV
train_split: train         # 全量数据：训练用官方 train 划分
eval_split: test
instances: null            # null=该 split 全部实例
img_size: [384, 640]
patch_size: 224
sigma_factor: 0.3
n_templates: 1
eval_n_templates: 1
min_gap_frames: 30

epochs: 200
batch_size: 16
num_workers: 8
lr: 0.0001
alpha: 2.0
pos_weight: 10.0
suppress_weight: 5.0
seed: 42
eval_every: 5
save_dir: ./checkpoints/dinov2_film
